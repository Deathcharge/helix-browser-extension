<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Helix Page Lens</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-container">
      <header class="header">
        <div class="logo"><span aria-hidden="true">🌀</span><span>Helix Page Lens</span></div>
        <span class="local-badge">On-device</span>
      </header>

      <section class="content" aria-labelledby="page-title">
        <div class="page-info">
          <h1 id="page-title" class="page-title">Current page</h1>
          <div id="page-url" class="page-url"></div>
        </div>

        <p id="privacy-note" class="privacy-note">Page text stays in this browser. Nothing is sent to a server.</p>
        <button id="analyze-btn" class="analyze-btn" type="button">Analyze this page</button>

        <div id="loading" class="loading hidden" role="status">Reading the page…</div>
        <div id="error" class="error hidden" role="alert">
          <strong>Couldn’t analyze this page</strong>
          <p id="error-message"></p>
          <button id="retry-btn" class="retry-btn" type="button">Try again</button>
        </div>

        <section id="results" class="results hidden" aria-live="polite">
          <div class="summary-row">
            <div><span class="eyebrow">Reading time</span><strong id="reading-time">—</strong></div>
            <div><span class="eyebrow">Words</span><strong id="word-count">—</strong></div>
            <div><span class="eyebrow">Updated</span><strong id="analyzed-at">—</strong></div>
          </div>
          <div class="metrics-grid">
            <div class="metric"><span>Readability</span><strong id="readability-score">—</strong><div class="metric-bar"><i id="readability-bar"></i></div></div>
            <div class="metric"><span>Structure</span><strong id="structure-score">—</strong><div class="metric-bar"><i id="structure-bar"></i></div></div>
            <div class="metric"><span>Evidence</span><strong id="evidence-score">—</strong><div class="metric-bar"><i id="evidence-bar"></i></div></div>
          </div>
          <p id="explanation" class="explanation"></p>
          <div id="keywords" class="keywords" aria-label="Frequent terms"></div>
          <div class="actions">
            <button id="copy-btn" class="action-btn" type="button">Copy summary</button>
            <button id="export-btn" class="action-btn" type="button">Export JSON</button>
            <button id="save-btn" class="action-btn" type="button">Save locally</button>
          </div>
        </section>
      </section>

      <footer class="footer"><span id="history-count">No saved analyses</span><button id="clear-history-btn" class="link-btn hidden" type="button">Clear</button></footer>
    </main>
    <script src="analyzer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
