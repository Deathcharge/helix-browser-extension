[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    extension: test extension configuration
    messaging: test messaging functionality
    storage: test storage functionality
    tabs: test tab management
    api: test API integration
    dom: test DOM manipulation
    events: test event handling
